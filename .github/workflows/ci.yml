name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [mingma-lab, mingma-mvp, mingma-3d, mingma-api]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        if: matrix.project != 'mingma-3d'
        run: npm test
      - name: Check types and build
        run: npm run build
      - name: Verify API contract is up to date
        if: matrix.project == 'mingma-api'
        run: git -C .. diff --exit-code -- docs/api/openapi.json postman/collections/mingma-ai.postman_collection.json
      - name: Check local static gateway
        if: matrix.project == 'mingma-api'
        run: node --test ../scripts/*.test.mjs
      - name: Package design lab preview
        if: matrix.project == 'mingma-lab'
        run: python3 scripts/package-delivery.py
      - name: Upload runnable preview package
        if: matrix.project == 'mingma-lab'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mingma-preview-${{ github.sha }}
          path: |
            delivery/mingma-frontends-preview.zip
            delivery/mingma-frontends-source.zip
            delivery/manifest.json
          if-no-files-found: error
          retention-days: 14
