<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1740" viewBox="0 0 1960 1740" font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect width="1960" height="1740" fill="#f7f8f5"/><text x="64" y="64" font-size="40" fill="#233b35" font-weight="600">明码 · 需求决策闭环</text><text x="64" y="108" font-size="21" fill="#5b6d64" font-weight="400">追问停止条件、商家修订路径与「日新」自进化  /  团队讨论补充建议</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#899d8f"/></marker></defs><path marker-end="url(#arrow)" d="M 590,252.5 L 645.0,252.5 L 645.0,252.5 L 700,252.5" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 1230,252.5 L 1285.0,252.5 L 1285.0,268.0 L 1340,268.0" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 1605.0,356 L 1605.0,440" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 1340,512.5 L 1285.0,512.5 L 1285.0,512.5 L 1230,512.5" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 700,512.5 L 645.0,512.5 L 645.0,528.0 L 590,528.0" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 325.0,616 L 325.0,720" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 590,808.0 L 645.0,808.0 L 645.0,808.0 L 700,808.0" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 590,528 L 635,528 L 635,650 L 1285,650 L 1285,808 L 1340,808" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 965.0,896 L 965.0,995" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 965,1140 L 965,1190 L 30,1190 L 30,528 L 60,528" fill="none" stroke="#b2bdb5" stroke-width="3" stroke-dasharray="9 6"/><path marker-end="url(#arrow)" d="M 1605,180 L 1605,145 L 965,145 L 965,180" fill="none" stroke="#b2bdb5" stroke-width="3" stroke-dasharray="9 6"/><path marker-end="url(#arrow)" d="M 590,1348.0 L 645.0,1348.0 L 645.0,1348.0 L 700,1348.0" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 1230,1348.0 L 1285.0,1348.0 L 1285.0,1348.0 L 1340,1348.0" fill="none" stroke="#b2bdb5" stroke-width="3"/><path marker-end="url(#arrow)" d="M 1605,896 L 1605,1215 L 325,1215 L 325,1260" fill="none" stroke="#b2bdb5" stroke-width="3" stroke-dasharray="9 6"/><path marker-end="url(#arrow)" d="M 1870,1348 L 1910,1348 L 1910,380 L 965,380 L 965,325" fill="none" stroke="#b2bdb5" stroke-width="3" stroke-dasharray="9 6"/><rect x="60" y="180" width="530" height="145" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="82" y="219" font-size="26" fill="#233b35" font-weight="600">① 用户表达与 AI 拆解</text><text x="82" y="256" font-size="22" fill="#42594c" font-weight="400">全局要求 + 房间具体诉求</text><text x="82" y="287" font-size="22" fill="#42594c" font-weight="400">识别歧义、遗漏与需要确认的维度</text><rect x="700" y="180" width="530" height="145" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="722" y="219" font-size="26" fill="#233b35" font-weight="600">② 对话后给选择题</text><text x="722" y="256" font-size="22" fill="#42594c" font-weight="400">优先询问会改变项目或方案的条件</text><text x="722" y="287" font-size="22" fill="#42594c" font-weight="400">支持自由补充与暂不确定</text><rect x="1340" y="180" width="530" height="176" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="1362" y="219" font-size="26" fill="#233b35" font-weight="600">③ 判断是否可以结束追问</text><text x="1362" y="256" font-size="22" fill="#42594c" font-weight="400">关键维度已答、无未处理冲突</text><text x="1362" y="287" font-size="22" fill="#42594c" font-weight="400">未知项明确标成待现场确认</text><text x="1362" y="318" font-size="22" fill="#42594c" font-weight="400">用户可以查看摘要并确认</text><rect x="1340" y="440" width="530" height="145" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="1362" y="479" font-size="26" fill="#233b35" font-weight="600">④ 用户确认需求文档</text><text x="1362" y="516" font-size="22" fill="#42594c" font-weight="400">每条需求有编号、区域、优先级</text><text x="1362" y="547" font-size="22" fill="#42594c" font-weight="400">保存依据、待确认事项和版本</text><rect x="700" y="440" width="530" height="145" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="722" y="479" font-size="26" fill="#233b35" font-weight="600">⑤ 商家制作并上传方案</text><text x="722" y="516" font-size="22" fill="#42594c" font-weight="400">施工项目、材料、工艺及点位</text><text x="722" y="547" font-size="22" fill="#42594c" font-weight="400">对齐需求编号，标明待勘测信息</text><rect x="60" y="440" width="530" height="176" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="82" y="479" font-size="26" fill="#233b35" font-weight="600">⑥ AI 审查并同步解释</text><text x="82" y="516" font-size="22" fill="#42594c" font-weight="400">有证据满足 / 有偏差 / 信息不足</text><text x="82" y="547" font-size="22" fill="#42594c" font-weight="400">检查遗漏、冲突、重复及新增理由</text><text x="82" y="578" font-size="22" fill="#42594c" font-weight="400">给出方案原文依据与具体问题</text><rect x="60" y="720" width="530" height="176" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="82" y="759" font-size="26" fill="#233b35" font-weight="600">⑦ 有偏差或信息不足</text><text x="82" y="796" font-size="22" fill="#42594c" font-weight="400">商家收到逐项问题清单</text><text x="82" y="827" font-size="22" fill="#42594c" font-weight="400">修改方案 / 补证 / 提出无法满足</text><text x="82" y="858" font-size="22" fill="#42594c" font-weight="400">说明新版改了什么及为什么</text><rect x="700" y="720" width="530" height="176" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="722" y="759" font-size="26" fill="#233b35" font-weight="600">⑧ 处理分歧（补充出口）</text><text x="722" y="796" font-size="22" fill="#42594c" font-weight="400">已解决 → 复查新版</text><text x="722" y="827" font-size="22" fill="#42594c" font-weight="400">待勘测 → 保留未决事项</text><text x="722" y="858" font-size="22" fill="#42594c" font-weight="400">需取舍 → 用户调整需求或选方案</text><rect x="1340" y="720" width="530" height="176" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="1362" y="759" font-size="26" fill="#233b35" font-weight="600">⑨ 用户理解并最终确认</text><text x="1362" y="796" font-size="22" fill="#42594c" font-weight="400">通俗解释专业术语和材料差异</text><text x="1362" y="827" font-size="22" fill="#42594c" font-weight="400">3D 展示对应区域、点位及效果</text><text x="1362" y="858" font-size="22" fill="#42594c" font-weight="400">保存需求、方案与确认记录</text><rect x="700" y="995" width="530" height="145" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="722" y="1034" font-size="26" fill="#233b35" font-weight="600">修订后复查（补充规则）</text><text x="722" y="1071" font-size="22" fill="#42594c" font-weight="400">复查问题是否解决及是否影响其他项</text><text x="722" y="1102" font-size="22" fill="#42594c" font-weight="400">需求改变时更新基准，再对照方案</text><rect x="60" y="1260" width="530" height="176" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="82" y="1299" font-size="26" fill="#233b35" font-weight="600">日新 · 收集已核实纠正</text><text x="82" y="1336" font-size="22" fill="#42594c" font-weight="400">记录漏问、漏检、误报及纠正依据</text><text x="82" y="1367" font-size="22" fill="#42594c" font-weight="400">用户或专业方确认后进入经验库</text><text x="82" y="1398" font-size="22" fill="#42594c" font-weight="400">一次反馈对应明确的适用条件</text><rect x="700" y="1260" width="530" height="176" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="722" y="1299" font-size="26" fill="#233b35" font-weight="600">日新 · 生成规则新版本</text><text x="722" y="1336" font-size="22" fill="#42594c" font-weight="400">更新追问策略、工项对应与审查规则</text><text x="722" y="1367" font-size="22" fill="#42594c" font-weight="400">预留案例比较旧版与新版</text><text x="722" y="1398" font-size="22" fill="#42594c" font-weight="400">记录来源、验证结果，支持回退</text><rect x="1340" y="1260" width="530" height="176" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="1362" y="1299" font-size="26" fill="#233b35" font-weight="600">日新 · 第二次运行验证</text><text x="1362" y="1336" font-size="22" fill="#42594c" font-weight="400">用未参与学习的需求或方案测试</text><text x="1362" y="1367" font-size="22" fill="#42594c" font-weight="400">比较遗漏数、误报数、人工纠正次数</text><text x="1362" y="1398" font-size="22" fill="#42594c" font-weight="400">展示学到了什么及适用范围</text><rect x="60" y="1500" width="1810" height="125" rx="14" fill="#edf1e7" stroke="#c7d2b5" stroke-width="2"/><text x="82" y="1539" font-size="26" fill="#233b35" font-weight="600">闭环说明</text><text x="82" y="1576" font-size="22" fill="#42594c" font-weight="400">关键信息不足时返回②补问；商家修订后经过复查再进入⑥；审查已有充分依据时进入⑨。</text><text x="82" y="1607" font-size="22" fill="#42594c" font-weight="400">解释和 3D 查看可在审查中使用。追问轮数取决于待确认事项，结束前需用户确认需求摘要。</text><text x="64" y="1704" font-size="19" fill="#657568" font-weight="400">根据团队讨论整理 · 仅硬装 · 需求与方案校验 · 补充建议均可继续调整</text></svg>