c" font-weight="400">跨房间的需求同步到相关区域</text><rect x="70" y="655" width="580" height="190" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="92" y="694" font-size="26" fill="#233b35" font-weight="600">区域性硬装入口</text><text x="92" y="731" font-size="22" fill="#42594c" font-weight="400">通过 3D 户型选择区域</text><text x="92" y="762" font-size="22" fill="#42594c" font-weight="400">客厅 / 卧室 / 厨房 / 卫生间 / 玄关</text><text x="92" y="793" font-size="22" fill="#42594c" font-weight="400">点选房间，查看需求和施工项目</text><rect x="70" y="900" width="580" height="190" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="92" y="939" font-size="26" fill="#233b35" font-weight="600">空间与项目关联</text><text x="92" y="976" font-size="22" fill="#42594c" font-weight="400">每个区域进入对应工程分类</text><text x="92" y="1007" font-size="22" fill="#42594c" font-weight="400">全局需求与局部需求合并、查冲突</text><text x="92" y="1038" font-size="22" fill="#42594c" font-weight="400">全局与区域共用第三层决策流程</text><rect x="70" y="1145" width="580" height="190" rx="14" fill="#eaf2ec" stroke="#b6cabb" stroke-width="2"/><text x="92" y="1184" font-size="26" fill="#233b35" font-weight="600">3D 表达（补充建议）</text><text x="92" y="1221" font-size="22" fill="#42594c" font-weight="400">定位施工范围、点位和示意线路</text><text x="92" y="1252" font-size="22" fill="#42594c" font-weight="400">点击项目，高亮对应空间</text><text x="92" y="1283" font-size="22" fill="#42594c" font-weight="400">标明已确认、示意与待实测信息</text><rect x="790" y="398" width="580" height="126" rx="14" fill="#f0f4f7" stroke="#c6d3dc" stroke-width="2"/><text x="812" y="437" font-size="26" fill="#233b35" font-weight="600">拆改工程</text><text x="812" y="474" font-size="22" fill="#42594c" font-weight="400">拆墙、砌墙、铲墙皮</text><text x="812" y="505" font-size="22" fill="#42594c" font-weight="400">门窗洞口修整等</text><rect x="790" y="542" width="580" height="157" rx="14" fill="#f0f4f7" stroke="#c6d3dc" stroke-width="2"/><text x="812" y="581" font-size="26" fill="#233b35" font-weight="600">水电与设备管线</text><text x="812" y="618" font-size="22" fill="#42594c" font-weight="400">强弱电、开关插座底盒、给排水</text><text x="812" y="649" font-size="22" fill="#42594c" font-weight="400">燃气改造（需资质）、地暖 / 暖气</text><text x="812" y="680" font-size="22" fill="#42594c" font-weight="400">中央空调 / 新风管线</text><rect x="790" y="717" width="580" height="95" rx="14" fill="#f0f4f7" stroke="#c6d3dc" stroke-width="2"/><text x="812" y="756" font-size="26" fill="#233b35" font-weight="600">防水工程</text><text x="812" y="793" font-size="22" fill="#42594c" font-weight="400">厨卫、阳台防水与闭水试验</text><rect x="790" y="830" width="580" height="126" rx="14" fill="#f0f4f7" stroke="#c6d3dc" stroke-width="2"/><text x="812" y="869" font-size="26" fill="#233b35" font-weight="600">泥瓦工程</text><text x="812" y="906" font-size="22" fill="#42594c" font-weight="400">墙地砖铺贴、地面找平、过门石</text><text x="812" y="937" font-size="22" fill="#42594c" font-weight="400">窗台石、包立管、砌筑等</text><rect x="790" y="974" width="580" height="126" rx="14" fill="#f0f4f7" stroke="#c6d3dc" stroke-width="2"/><text x="812" y="1013" font-size="26" fill="#233b35" font-weight="600">木工工程</text><text x="812" y="1050" font-size="22" fill="#42594c" font-weight="400">吊顶、石膏线、隔墙、背景墙基层</text><text x="812" y="1081" font-size="22" fill="#42594c" font-weight="400">门套窗套基层、窗帘盒等</text><rect x="790" y="1118" width="580" height="126" rx="14" fill="#f0f4f7" stroke="#c6d3dc" stroke-width="2"/><text x="812" y="1157" font-size="26" fill="#233b35" font-weight="600">油漆工程</text><text x="812" y="1194" font-size="22" fill="#42594c" font-weight="400">墙面腻子、乳胶漆、木器漆</text><text x="812" y="1225" font-size="22" fill="#42594c" font-weight="400">壁纸基层等</text><rect x="790" y="1262" width="580" height="157" rx="14" fill="#f0f4f7" stroke="#c6d3dc" stroke-width="2"/><text x="812" y="1301" font-size="26" fill="#233b35" font-weight="600">安装工程</text><text x="812" y="1338" font-size="22" fill="#42594c" font-weight="400">门窗、地板、踢脚线、橱柜、定制柜</text><text x="812" y="1369" font-size="22" fill="#42594c" font-weight="400">卫浴洁具、五金、灯具、开关插座</text><text x="812" y="1400" font-size="22" fill="#42594c" font-weight="400">热水器等</text><rect x="790" y="1437" width="580" height="95" rx="14" fill="#f0f4f7" stroke="#c6d3dc" stroke-width="2"/><text x="812" y="1476" font-size="26" fill="#233b35" font-weight="600">其他固定项目</text><text x="812" y="1513" font-size="22" fill="#42594c" font-weight="400">楼梯、护栏、阳光房等</text><rect x="1510" y="410" width="580" height="154" rx="14" fill="#f3eff7" stroke="#d4c8e0" stroke-width="2"/><text x="1532" y="449" font-size="26" fill="#233b35" font-weight="600">理解与澄清需求</text><text x="1532" y="486" font-size="22" fill="#42594c" font-weight="400">生活化表达 → 对话 → 选择题</text><text x="1532" y="517" font-size="22" fill="#42594c" font-weight="400">识别需确认的维度与常见遗漏</text><rect x="1510" y="598" width="580" height="154" rx="14" fill="#f3eff7" stroke="#d4c8e0" stroke-width="2"/><text x="1532" y="637" font-size="26" fill="#233b35" font-weight="600">形成需求基准（补充确认）</text><text x="1532" y="674" font-size="22" fill="#42594c" font-weight="400">必须满足 / 偏好 / 待现场确认</text><text x="1532" y="705" font-size="22" fill="#42594c" font-weight="400">用户审核后保存需求文档版本</text><rect x="1510" y="786" width="580" height="154" rx="14" fill="#f3eff7" stroke="#d4c8e0" stroke-width="2"/><text x="1532" y="825" font-size="26" fill="#233b35" font-weight="600">商家制作并上传方案</text><text x="1532" y="862" font-size="22" fill="#42594c" font-weight="400">逐项回应需求，提供材料和工艺</text><text x="1532" y="893" font-size="22" fill="#42594c" font-weight="400">关联房间、施工项目与说明依据</text><rect x="1510" y="974" width="580" height="154" rx="14" fill="#f3eff7" stroke="#d4c8e0" stroke-width="2"/><text x="1532" y="1013" font-size="26" fill="#233b35" font-weight="600">AI 对照审查</text><text x="1532" y="1050" font-size="22" fill="#42594c" font-weight="400">需求遗漏、冲突、范围重复</text><text x="1532" y="1081" font-size="22" fill="#42594c" font-weight="400">新增项目是否必要、信息是否充分</text><rect x="1510" y="1162" width="580" height="154" rx="14" fill="#f3eff7" stroke="#d4c8e0" stroke-width="2"/><text x="1532" y="1201" font-size=